# Tests the backend and the app, then builds the Android APK and publishes it
# as a GitHub release, so the latest build can always be downloaded from:
#   https://github.com/<owner>/<repo>/releases/download/apk-<branch>/pointy.apk
# (main publishes to apk-main). Every run also keeps the APK as an artifact.
#
# Optional settings (repository Settings → Secrets and variables → Actions):
#   variable API_BASE                   backend URL baked into the app
#                                       (default https://pointy-ceoi.onrender.com)
#   secret ANDROID_KEYSTORE_BASE64      base64 of a release keystore (.jks)
#   secret ANDROID_KEYSTORE_PASSWORD    its store password
#   secret ANDROID_KEY_ALIAS            the key alias
#   secret ANDROID_KEY_PASSWORD         the key password
# With the keystore secrets every APK is signed with the same key, so a new
# build installs over the old one. Without them each build uses a fresh debug
# key and phones must uninstall the old APK first.
name: APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Go + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pointy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pointy-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pointy-be/go.mod
          cache-dependency-path: pointy-be/go.sum
      - run: go vet ./...
      - name: go test (two-phone end-to-end test runs on Postgres)
        run: go test -race -count=1 ./...
        env:
          POINTY_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pointy_test

  apk:
    name: App tests and APK
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: pointy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key. Uninstall the old APK before installing this one."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build the APK
        env:
          API_BASE: ${{ vars.API_BASE || 'https://pointy-ceoi.onrender.com' }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE="$API_BASE" \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk pointy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pointy-apk
          path: pointy/pointy.apk

      - name: Publish the download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" pointy.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Pointy APK ($GITHUB_REF_NAME)" \
            --notes "Built from ${GITHUB_SHA::7} (run #${{ github.run_number }}). Talks to ${{ vars.API_BASE || 'https://pointy-ceoi.onrender.com' }}."
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/pointy.apk" >> "$GITHUB_STEP_SUMMARY"
