# Render Blueprint: the Pointy backend plus a Postgres database.
# New Blueprint in the Render dashboard, point it at this repo, and fill in
# the values marked sync: false when asked.
services:
  - type: web
    name: pointy
    runtime: go
    rootDir: pointy-be
    plan: free
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pointy-db
          property: connectionString
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_CURRENCY
        value: USD
      - key: POINTY_INR_PER_UNIT
        value: "85"
      - key: PAYPAL_WEBHOOK_ID
        sync: false

databases:
  - name: pointy-db
    plan: free
